# Minimal sway config for the headless CI compositor (scripts/headless-smoke.sh).
#
# Kept free of anything host-specific so CI behaves identically everywhere.
# Deliberately EMPTY: sway's config parser rejects `create_output` as a config
# command (CI run 8: "Unknown/invalid command 'create_output'") — it is an IPC
# command (`swaymsg create_output`) to run after startup. Yet run 8 also proved
# the empty config comes up fine and fast: the compositor created its socket
# within ~0.1 s once the xwayland package was installed. The one thing a headless
# run does not get for free is an output with a surface to render on, and the
# smoke script's assertions (layer-shell advertised, wl_output advertised, IPC,
# clean shutdown) do not need a *drivable* output — the probe reads the global
# registry, not pixels. Adding pixel-level assertions to CI is P2 work, and it
# will come with `swaymsg create_output` called from the script after the
# compositor is up.
#
# History, so nobody re-derives it from eight CI runs: an empty config aborts on
# the missing Xwayland binary (run 1) — fixed by installing the xwayland package;
# the script then waited for `wayland-0` while the compositor had created
# `wayland-1` (runs 4–8), invisible behind the hardcoded name.


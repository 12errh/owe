# Minimal sway config for the headless CI compositor (scripts/headless-smoke.sh).
#
# Intentionally empty of real configuration: sway needs a config file to start,
# and the headless backend (WLR_BACKENDS=headless) provides a virtual output.
# Keep this free of anything host-specific so CI behaves identically everywhere.
#
# Why no `xwayland disable` here, despite CI lacking /usr/bin/Xwayland? Evidence
# from CI runs 35461889214/35462429597/35463304332/35463791483: with an empty
# config, sway aborts on the missing Xwayland binary — loudly, with a cause in
# the log (run 1). With `xwayland disable`, sway stayed alive for the whole wait
# window producing no log and no socket (runs 3–4) — a hang is strictly worse
# than a crash, so the config goes back to empty and CI installs the `xwayland`
# package instead, which lets the run-1 path complete. If this ever regresses,
# the smoke script's failure diagnostics print whether the compositor process is
# alive and what it logged.

# Nothing to configure.

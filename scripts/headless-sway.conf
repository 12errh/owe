# Minimal sway config for the headless CI compositor (scripts/headless-smoke.sh).
#
# The one line that matters: create a headless output. On wlroots 0.17 (Ubuntu
# 24.04's build), a headless backend creates NO outputs on its own — sway reaches
# its event loop (`ep_poll` in the failure diagnostics, CI runs 4–6) but nothing
# ever calls wl_output creation, so no `wayland-0` socket-backed global appears
# and the smoke script waits forever. `swaymsg create_output` is also the
# documented way to do this at runtime; doing it in the config keeps the script
# stateless.
#
# History, so nobody re-derives it from six CI runs: an empty config aborts on
# the missing Xwayland binary (run 1); `xwayland disable` plus installing the
# xwayland package got sway to the event loop but no further (runs 4–6). What
# actually produces a socket is this output line.
#
# Keep the rest free of host-specific configuration so CI behaves identically.
output HEADLESS-1 mode 1280x720


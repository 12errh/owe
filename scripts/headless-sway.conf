# Minimal sway config for the headless CI compositor (scripts/headless-smoke.sh).
#
# `swaymsg create_output` at startup: on wlroots 0.17 (Ubuntu 24.04), a headless
# backend creates NO outputs on its own, so without this nothing ever produces a
# socket the smoke script can find (CI runs 4–7: alive in ep_poll, no socket).
# `create_output` runs as an IPC command once sway's IPC is up, which is exactly
# when this line executes.
#
# History, so nobody re-derives it from seven CI runs: an empty config aborts on
# the missing Xwayland binary (run 1); `xwayland disable` got sway to its event
# loop but no further (runs 4–6); `output HEADLESS-1 mode …` only *configures* an
# output — it cannot create one that does not exist (run 7). Creating the output
# is the missing step, and the smoke script now accepts any wayland-* socket
# name rather than waiting only for `wayland-0`.
create_output


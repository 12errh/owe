# OWE CI — the enforcement point for the phase gates (docs/IMPLEMENTATION-PLAN.md §0).
#
# Runners are ubuntu-24.04, matching the Reference Profile's base (Zorin OS 18 =
# Ubuntu 24.04; ADR-014/ADR-015/ADR-016).
#
# NOTE: there is deliberately no fuzz job yet. Fuzz targets land with the media
# parsers in P4 (TRD NFR-SEC-2); a job that fuzzes nothing would be theatre.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: build
        run: cargo build --workspace --all-targets
      - name: nextest
        run: cargo nextest run --workspace --no-fail-fast
      - name: doctests
        run: cargo test --workspace --doc

  coverage:
    name: coverage gate (logic crates)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # NFR-CODE-1: hygiene floor on the pure-logic crates. Rendering and Wayland
      # crates are covered by integration/golden tests instead, so they are not
      # part of this gate on purpose.
      - name: coverage
        run: >
          cargo llvm-cov
          --package owe-core --package owe-ipc
          --fail-under-lines 70
          --lcov --output-path lcov.info
      - name: upload report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

  app:
    name: tauri app (typecheck + build + lint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      # Tauri v2's Linux dependency set (webkit2gtk 4.1 on Ubuntu 24.04, which is
      # the Reference Profile's base — ADR-014/ADR-015).
      - name: install Tauri build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - name: frontend — install, typecheck, build
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: app crate — fmt + clippy
        working-directory: app/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: app crate — build
        working-directory: app/src-tauri
        run: cargo build
      # The GUI's daemon-facing path is tested against a stub daemon hosted in
      # process (its own `tests` module), so this needs no compositor and no
      # running daemon. It is what stops "the GUI compiles" from counting as
      # "the GUI works" (P1 gate: GUI apply).
      - name: app crate — tests (stub-daemon IPC contract)
        working-directory: app/src-tauri
        run: cargo test

  headless-wayland:
    name: headless Wayland smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install compositor + wayland tools
        run: |
          sudo apt-get update
          # `xwayland` is required by sway: without the binary, sway aborts with
          # "Cannot find Xwayland binary" before creating its socket (CI run
          # 35461889214). Disabling Xwayland in the config instead made sway
          # hang silently with no socket at all (runs 35462429597–35463791483),
          # so installing the package is the evidence-backed fix.
          sudo apt-get install -y --no-install-recommends sway wayland-utils xwayland
      - name: build
        run: cargo build --workspace
      # P0 scope: proves the harness (headless compositor comes up, protocol
      # probe works, owed serves IPC, clean shutdown). Surface creation and
      # screencopy assertions are added in P1 when there is a surface to assert.
      - name: smoke
        run: ./scripts/headless-smoke.sh

[package]
name = "owe-render"
description = "OWE rendering: wgpu device management and headless golden-image tooling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
image = { version = "0.25.9", default-features = false, features = ["png"] }
pollster = "1.0.1"
thiserror = { workspace = true }
wgpu = "26.0.1"

# Wayland client stack for the layer-shell presenter (P1). These versions are the
# combination the studied reference engines (wallr, phonto) build against, so the
# API surface is known-good rather than guessed.
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-client = "0.31"

# The event loop (ARCHITECTURE §4: "Event loop | calloop (no tokio)"). The
# presenter waits on the Wayland socket and its command channel as two event
# sources, so an idle wallpaper engine wakes for nothing at all instead of
# polling a channel every 50 ms (the P1 debt in IMPLEMENTATION-PLAN §1.2.3).
calloop = "0.14"
calloop-wayland-source = "0.4"

[dev-dependencies]
tempfile = "3"
# Test-only: the render path's contract with the media layer is "RGBA8 buffers of
# a known size", and `tests/animated_frames.rs` proves it against real decoded
# frames rather than hand-built ones. Nothing in this crate depends on decoding at
# runtime (BACKEND-DESIGN §1).
owe-media = { workspace = true }

# NOTE: `unsafe_code` stays at the workspace default (warn). This crate is where
# reviewed unsafe will appear for dma-buf importing from P4; every use needs a
# SAFETY comment and review (STRATEGY §3).
[lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "warn"

[lints.clippy]
all = "warn"

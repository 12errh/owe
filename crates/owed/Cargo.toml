[package]
name = "owed"
description = "OWE daemon: renders wallpapers on layer-shell surfaces and serves the control IPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "owed"
path = "src/main.rs"

[dependencies]
owe-core = { workspace = true }
owe-ipc = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[package]
name = "owed"
description = "OWE daemon: renders wallpapers on layer-shell surfaces and serves the control IPC."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "owed"
path = "src/main.rs"

[dependencies]
owe-core = { workspace = true }
owe-ipc = { workspace = true }
owe-media = { workspace = true }
owe-render = { workspace = true }
owe-shell-caelestia = { workspace = true }
owe-shell-generic = { path = "../owe-shell-generic" }
owe-shell-hyprland = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
# Test fixtures only: the library and thumbnail tests write real PNGs, because a
# scanner test that fakes the pixels would not prove the thumbnail path works.
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg"] }

[lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

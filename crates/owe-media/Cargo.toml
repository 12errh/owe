[package]
name = "owe-media"
description = "OWE media decoding: still and animated images and video behind one MediaDecoder trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# AVIF decoding pulls in a large C dependency chain, so it is opt-in (the P1 plan
# calls for exactly this: "decode via the image crate (+avif feature flag)").
avif = ["image/avif"]

[dependencies]
owe-core = { workspace = true }
thiserror = { workspace = true }
image = { version = "0.25.9", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "bmp",
  "gif",
  "tiff",
] }
# The animated frame cache is compressed by design (TRD FR-LIVE-1: "compressed
# (lz4 or zstd)"). `zstd` links the bundled C library, so it needs no system
# package; `lz4_flex` is pure Rust. Both are selected per config and neither is
# used on the still-image path.
zstd = "0.13.2"
lz4_flex = { version = "0.11", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
